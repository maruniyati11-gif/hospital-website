<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Appointment</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <header>

        <h2>🏥 City Care Hospital</h2>


        <nav>

            <a href="home.html" target="_blank">
                Home
            </a>


            <a href="doctors.html" target="_blank">
                Doctors
            </a>


            <a href="departments.html" target="_blank">
                Departments
            </a>


            <a href="appointment.html" target="_blank">
                Appointment
            </a>


            <a href="reviews.html" target="_blank">
                Reviews
            </a>


            <a href="bmi.html" target="_blank">
                BMI
            </a>


            <a href="contact.html" target="_blank">
                Contact
            </a>

        </nav>

    </header>


    <section class="section">

        <h1>

            Book an Appointment

        </h1>


        <form
            class="appointment-form"
            onsubmit="bookAppointment(event)"
        >


            <input

                type="text"

                id="patientName"

                placeholder="Patient Name"

                required

            >


            <input

                type="email"

                placeholder="Email Address"

                required

            >


            <input

                type="date"

                required

            >


            <select required>


                <option value="">

                    Select Doctor

                </option>


                <option>

                    Dr. Priya Shah

                </option>


                <option>

                    Dr. Rahul Patel

                </option>


                <option>

                    Dr. Anjali Mehta

                </option>


            </select>


            <button type="submit">

                Book Appointment

            </button>


        </form>


        <p id="appointmentMessage"></p>

    </section>

</body>

</html>
